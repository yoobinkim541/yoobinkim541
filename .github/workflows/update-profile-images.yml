name: Update profile images
on:
  schedule:
    - cron: "30 15 * * *" # 00:30 KST
  workflow_dispatch:
  push:
    paths:
      - config/profile-3d.json
      - scripts/update-languages.mjs
      - scripts/theme-3d-contrib.mjs
      - .github/workflows/update-profile-images.yml
permissions:
  contents: write
concurrency:
  group: profile-images-${{ github.ref }}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/profile-3d.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Theme 3D graph
        run: node scripts/theme-3d-contrib.mjs profile-3d-contrib/profile-blue.svg
      - name: Languages card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LANGUAGES_TOKEN: ${{ secrets.PROFILE_LANGUAGES_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/update-languages.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets/github-languages.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile images"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
